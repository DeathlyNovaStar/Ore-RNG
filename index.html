<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pickaxe.png" type="image/x-icon">
    <title>Ore RNG</title>
</head>
<body>
    <div id="mainframe">
        <div id="rolledItem">
            <h1 id="ore"></h1>
            <h2 id="counterDisplay">Total Rolls: 0</h2>
            <h2 id="wallet">Cash: $0</h2>
        </div>
        <div id="previousItem">
            <h3 id="prevOre">Previous Ore:</h3>
            <p id="ore1"></p>
            <p id="ore2"></p>
            <p id="ore3"></p>
        </div>
        <div id="oreChances">
            <h2 id="chances">Ore Chances:</h2>
            <p id="stone" class="ores">Stone: 50%</p>
            <p id="coal" class="ores">Coal: 30%</p>
            <p id="iron" class="ores">Iron: 10%</p>
            <p id="gold" class="ores">Gold: 6%</p>
            <p id="diamond" class="ores">Diamond: 3%</p>
            <p id="void" class="ores">Void: 1%</p>
        </div>

        <label for="button" id="buttonlabel">-$10</label>
        <button id="button">Roll</button>
        
        <div id="sidebar" class="sidebar-hidden">
            <button id="sidebar-toggle">▶</button>

            <h2>Inventory Vault</h2><hr>
            
            <p>Stone: <span id="vaultStone">0</span> <button class="sell-btn" data-ore="Stone">Sell</button></p>
            <p>Coal: <span id="vaultCoal">0</span> <button class="sell-btn" data-ore="Coal">Sell</button></p>
            <p>Iron: <span id="vaultIron">0</span> <button class="sell-btn" data-ore="Iron">Sell</button></p>
            <p>Gold: <span id="vaultGold">0</span> <button class="sell-btn" data-ore="Gold">Sell</button></p>
            <p>Diamond: <span id="vaultDiamond">0</span> <button class="sell-btn" data-ore="Diamond">Sell</button></p>
            <p>Void: <span id="vaultVoid">0</span> <button class="sell-btn" data-ore="Void">Sell</button></p>
            
            <hr>
            <button id="sell-all-btn">SELL ALL</button>
        </div>
    </div>
    <div id="game-version">Alpha v1.2</div>
    <script src="script.js"></script>
</body>
</html>
